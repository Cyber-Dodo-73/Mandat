name: mandat

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mandat}
      POSTGRES_USER: ${POSTGRES_USER:-mandat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mandat}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mandat}
      DATABASE_USERNAME: ${POSTGRES_USER:-mandat}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-mandat}
      MANDAT_CORS_ALLOWED_ORIGINS: ${MANDAT_CORS_ALLOWED_ORIGINS:-}
      MANDAT_API_DOCS_ENABLED: ${MANDAT_API_DOCS_ENABLED:-true}
      MANDAT_JWT_SECRET: ${MANDAT_JWT_SECRET:?Set MANDAT_JWT_SECRET (at least 32 bytes) in .env}
      MANDAT_APPLE_CLIENT_IDS: ${MANDAT_APPLE_CLIENT_IDS:-fr.cyberdodo.mandat}
      MANDAT_GOOGLE_CLIENT_IDS: ${MANDAT_GOOGLE_CLIENT_IDS:-}
      MANDAT_EXPO_ACCESS_TOKEN: ${MANDAT_EXPO_ACCESS_TOKEN:-}
      MANDAT_PUSH_ENABLED: ${MANDAT_PUSH_ENABLED:-true}
      MANDAT_PUBLIC_BASE_URL: ${MANDAT_PUBLIC_BASE_URL:-https://mandat.cyber-dodo.fr}
      MANDAT_DATA_KEY: ${MANDAT_DATA_KEY:-}
      MANDAT_APPLE_TEAM_ID: ${MANDAT_APPLE_TEAM_ID:-}
      MANDAT_APPLE_KEY_ID: ${MANDAT_APPLE_KEY_ID:-}
      MANDAT_APPLE_PRIVATE_KEY: ${MANDAT_APPLE_PRIVATE_KEY:-}
      MANDAT_SMTP_HOST: ${MANDAT_SMTP_HOST:-}
      MANDAT_SMTP_PORT: ${MANDAT_SMTP_PORT:-587}
      MANDAT_SMTP_USERNAME: ${MANDAT_SMTP_USERNAME:-}
      MANDAT_SMTP_PASSWORD: ${MANDAT_SMTP_PASSWORD:-}
      MANDAT_SMTP_FROM: ${MANDAT_SMTP_FROM:-MANDAT <no-reply@cyber-dodo.fr>}
      MANDAT_MODERATION_WEBHOOK: ${MANDAT_MODERATION_WEBHOOK:-}
      MANDAT_TERMS_VERSION: ${MANDAT_TERMS_VERSION:-2026-10-19}
      MANDAT_OPERATOR_NAME: ${MANDAT_OPERATOR_NAME:-}
      MANDAT_OPERATOR_ADDRESS: ${MANDAT_OPERATOR_ADDRESS:-}
      MANDAT_CONTACT_EMAIL: ${MANDAT_CONTACT_EMAIL:-contact@cyber-dodo.fr}
      MANDAT_HOSTING_PROVIDER: ${MANDAT_HOSTING_PROVIDER:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
