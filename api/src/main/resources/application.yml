spring:
  application:
    name: mandat-api
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mandat}
    username: ${DATABASE_USERNAME:mandat}
    password: ${DATABASE_PASSWORD:mandat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Trust X-Forwarded-* only from internal proxies (Traefik), so rate limits see the real client IP.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: ${MANDAT_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${MANDAT_API_DOCS_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/**
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

mandat:
  app-name: MANDAT
  api-version: v1
  cors:
    allowed-origins: ${MANDAT_CORS_ALLOWED_ORIGINS:}
  jwt:
    # Required, at least 32 bytes. Startup fails when missing (only the dev profile has a default).
    secret: ${MANDAT_JWT_SECRET:}
    access-token-ttl: ${MANDAT_ACCESS_TOKEN_TTL:PT15M}
  auth:
    refresh-token-ttl: ${MANDAT_REFRESH_TOKEN_TTL:P30D}
    apple:
      # Accepted ID-token audiences, comma-separated (app bundle id, Services ID for web).
      client-ids: ${MANDAT_APPLE_CLIENT_IDS:fr.cyberdodo.mandat}
    google:
      # OAuth client ids (iOS, Android, web), comma-separated. Empty disables Google sign-in.
      client-ids: ${MANDAT_GOOGLE_CLIENT_IDS:}
  push:
    # Expo push service. The access token is optional (only needed with "enhanced push security").
    enabled: ${MANDAT_PUSH_ENABLED:true}
    expo-access-token: ${MANDAT_EXPO_ACCESS_TOKEN:}
    jobs-enabled: ${MANDAT_PUSH_JOBS_ENABLED:true}
  rate-limit:
    policies:
      auth-register-ip: { capacity: 5, period: PT1H }
      auth-login-ip: { capacity: 20, period: PT1M }
      auth-login-account: { capacity: 5, period: PT5M }
      auth-refresh-ip: { capacity: 60, period: PT1M }
      auth-social-ip: { capacity: 20, period: PT1M }
      report-user: { capacity: 5, period: PT1H }

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  structured:
    format:
      console: ""

mandat:
  jwt:
    secret: ${MANDAT_JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
  auth:
    apple:
      # host.exp.Exponent is the audience of Apple tokens issued inside Expo Go.
      client-ids: ${MANDAT_APPLE_CLIENT_IDS:fr.cyberdodo.mandat,host.exp.Exponent}
